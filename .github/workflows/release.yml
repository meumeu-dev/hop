name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            name: hop-linux-amd64
          - goos: linux
            goarch: arm64
            name: hop-linux-arm64
          - goos: linux
            goarch: arm
            goarm: "7"
            name: hop-linux-arm32
          - goos: darwin
            goarch: amd64
            name: hop-darwin-amd64
          - goos: darwin
            goarch: arm64
            name: hop-darwin-arm64
          - goos: windows
            goarch: amd64
            name: hop-windows-amd64.exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: go build -ldflags "-X main.Version=${GITHUB_REF_NAME}" -o ${{ matrix.name }} .

      - name: Generate checksum
        run: sha256sum ${{ matrix.name }} > ${{ matrix.name }}.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}
            ${{ matrix.name }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate changelog
        id: changelog
        run: |
          # Find previous tag
          PREV_TAG=$(git tag --sort=-version:refname | head -2 | tail -1)
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG=$(git rev-list --max-parents=0 HEAD)
          fi
          echo "Previous tag: $PREV_TAG"
          # Generate changelog from commit messages (skip Co-Authored-By lines)
          CHANGES=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --no-merges | grep -v "Co-Authored-By" | head -30)
          # Write to file for multiline
          echo "$CHANGES" > /tmp/changelog.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: /tmp/changelog.md
