name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            name: hop-linux-amd64
          - goos: linux
            goarch: arm64
            name: hop-linux-arm64
          - goos: linux
            goarch: arm
            goarm: "7"
            name: hop-linux-arm32
          - goos: darwin
            goarch: amd64
            name: hop-darwin-amd64
          - goos: darwin
            goarch: arm64
            name: hop-darwin-arm64
          - goos: windows
            goarch: amd64
            name: hop-windows-amd64.exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: go build -ldflags "-X main.Version=${GITHUB_REF_NAME}" -o ${{ matrix.name }} .

      - name: Generate checksum
        run: sha256sum ${{ matrix.name }} > ${{ matrix.name }}.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}
            ${{ matrix.name }}.sha256

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: mobile
        run: gradle assembleRelease

      - name: Sign APK
        working-directory: mobile
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cp app/build/outputs/apk/release/app-release-unsigned.apk hop-android.apk
          echo "$ANDROID_KEYSTORE" | base64 -d > release.keystore
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -1)
          $APKSIGNER sign --ks release.keystore --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" --key-pass "pass:$ANDROID_KEY_PASSWORD" --ks-key-alias "$ANDROID_KEY_ALIAS" hop-android.apk

      - name: Generate checksum
        working-directory: mobile
        run: sha256sum hop-android.apk > hop-android.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: hop-android.apk
          path: |
            mobile/hop-android.apk
            mobile/hop-android.apk.sha256

  release:
    needs: [build, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate changelog
        id: changelog
        run: |
          # Find previous tag
          PREV_TAG=$(git tag --sort=-version:refname | head -2 | tail -1)
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG=$(git rev-list --max-parents=0 HEAD)
          fi
          echo "Previous tag: $PREV_TAG"
          # Generate changelog from commit messages (skip Co-Authored-By lines)
          CHANGES=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --no-merges | grep -v "Co-Authored-By" | head -30)
          # Write to file for multiline
          echo "$CHANGES" > /tmp/changelog.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: /tmp/changelog.md
